name: sequelize_orm_quickjs
description: >-
  An in-process QuickJS JavaScript engine for sequelize_orm. Embeds a full
  Sequelize ORM runtime inside the Dart native binary via dart:ffi and
  QuickJS C (vendored) — no Node.js subprocess required.
version: 0.1.0
repository: https://github.com/crazidev/sequelize_orm_dart/tree/main/packages/sequelize_orm_quickjs
resolution: workspace

topics:
  - orm
  - database
  - sql
  - quickjs
  - ffi

environment:
  sdk: ^3.8.0

dependencies:
  sequelize_orm: any
  ffi: ^2.1.3
  path: ^1.9.0
  crypto: ^3.0.3
  meta: ^1.17.0
  native_assets_cli: ^0.18.0
  native_toolchain_c: ^0.19.0
  hooks: ^2.1.0
  logging: ^1.2.0

dev_dependencies:
  test: ^1.25.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

